version: '3.8'

services:
  step-ca:
    image: smallstep/step-ca:latest
    container_name: step-ca
    volumes:
      - ./step-data:/home/step
      - ./init-step-ca.sh:/init-step-ca.sh:ro
    entrypoint: /init-step-ca.sh
    ports:
      - "9000:9000"
    environment:
      - CA_NAME=Vaultica CA
      - CA_DNS=step-ca,localhost
      - CA_PROVISIONER=admin
    networks:
      - step-network
    restart: unless-stopped

  web-gui:
    build: .
    container_name: step-ca-gui
    volumes:
      - ./www:/var/www/html
      - ./step-data:/home/step:ro
    ports:
      - "8080:80"
    environment:
      - CA_URL=https://step-ca:9000
      - CA_PROVISIONER=admin
      - CA_PASSWORD_FILE=/home/step/secrets/password
      - STEP_ROOT=/home/step/certs/root_ca.crt
    networks:
      - step-network
    depends_on:
      - step-ca
    restart: unless-stopped

networks:
  step-network:
    driver: bridge
