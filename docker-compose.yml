  web-gui:
    build: .
    container_name: step-ca-gui
    volumes:
      - ./www:/var/www/html
      - ./step-data:/home/step:ro
    environment:
      - CA_URL=https://ca.home.hausner.space:9000
      - CA_PROVISIONER=ca-admin
      - CA_PASSWORD_FILE=/home/step/secrets/password
      - STEP_ROOT=/home/step/certs/root_ca.crt
    networks:
      qnet:
        ipv4_address: 192.168.16.26
    
    depends_on:
      - step-ca
    restart: unless-stopped

networks:
  qnet:
    external: true
    name: qnet-static-eth0-7dbf98
